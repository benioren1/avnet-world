# Regular (non-secret) settings. Change here, then:
#   kubectl apply -f configmap.yaml
#   kubectl rollout restart deployment/avnet-world
# (environment variables are read when the pod starts, so a restart is needed)
#
# Game rules (lock time, mining hours, bonuses, work days...) are NOT here:
# they live in the database and are edited live in the admin panel, "הגדרות" tab.
apiVersion: v1
kind: ConfigMap
metadata:
  name: avnet-world-config
data:
  # Port the server listens on inside the container.
  PORT: "3001"
  # Timezone for "today", lock times, mining hours and the nightly payout.
  GAME_TZ: "Asia/Jerusalem"
  # Mongo database name (the connection URL itself is in the Secret).
  MONGO_DB: "architecture_game"
  # Address people open; used for the links the server prints in its log.
  PUBLIC_URL: "https://avnet-world.example.local"
  # Number of proxies in front of the server (the ingress = 1).
  # Needed so the admin lockout blocks only the person who guessed wrong, not everyone.
  TRUST_PROXY: "1"
