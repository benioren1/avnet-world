# Codes and passwords. This is a TEMPLATE: copy it to secret.yaml, fill in real
# values, apply it, and do not commit the filled copy (secret.yaml is in .gitignore).
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: avnet-world-secret
type: Opaque
stringData:
  # Admin code, at least 8 characters.
  ADMIN_TOKEN: "change-me-admin-code"
  # Code for the office TV link. Leave empty to let the admin panel create and reset it.
  TV_TOKEN: ""
  # Mongo connection, including user and password if needed.
  MONGO_URL: "mongodb://user:password@mongo-host:27017/?authSource=admin"
